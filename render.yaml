services:
  - type: web
    name: vajranet-citizen-mobile
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./android/app/src/main/assets/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vajranet-backend.onrender.com/api/v1
